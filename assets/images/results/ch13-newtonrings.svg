<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<title>牛顿环装置截面与干涉环俯视图</title>
<rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

<defs>
<marker id="mNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="mBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
<marker id="mAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
<marker id="mBrown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
</defs><line x1="455" y1="36" x2="455" y2="440" stroke="#e5e7eb" stroke-width="1"/>
<text x="225" y="46" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold" >① 装置截面（侧视）</text>
<text x="660" y="46" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold" >② 反射光干涉环（俯视）</text>
<path d="M 85 270 A 193.33 193.33 0 0 0 365 270 L 365 330 L 85 330 Z" fill="#fef9c3" opacity="0.9"/>
<path d="M 85 210 L 85 270 A 193.33 193.33 0 0 0 365 270 L 365 210 Z" fill="#eff6ff" stroke="#475569" stroke-width="1.8"/>
<rect x="60" y="330" width="330" height="40" fill="#dbeafe" stroke="#475569" stroke-width="1.8"/>
<text x="225" y="354" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal" >平板玻璃</text>
<text x="170" y="245" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal" >平凸透镜</text>
<circle cx="225" cy="136.7" r="2.5" fill="#334155"/>
<text x="217" y="133" font-size="11" fill="#475569" text-anchor="end" font-weight="normal" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" >C</text>
<line x1="228" y1="141.7" x2="346.3" y2="282.8" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="300" y="228" font-size="12" fill="#334155" text-anchor="start" font-weight="normal" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" >R（曲率半径）</text>
<line x1="140" y1="115" x2="140" y2="205" stroke="#ca8a04" stroke-width="2.4" marker-end="url(#mAmber)"/>
<line x1="200" y1="115" x2="200" y2="205" stroke="#ca8a04" stroke-width="2.4" marker-end="url(#mAmber)"/>
<line x1="260" y1="115" x2="260" y2="205" stroke="#ca8a04" stroke-width="2.4" marker-end="url(#mAmber)"/>
<text x="200" y="100" font-size="13" fill="#92400e" text-anchor="middle" font-weight="normal" >单色平行光（垂直照射）</text>
<line x1="330" y1="205" x2="330" y2="150" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mAmber)"/>
<text x="338" y="160" font-size="12" fill="#92400e" text-anchor="start" font-weight="normal" >反射光（向上观察）</text>
<circle cx="225" cy="330" r="3.5" fill="#dc2626"/>
<text x="225" y="392" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal" >凸面与平板仅在中心一点接触</text>
<text x="225" y="410" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" >（截面曲率已夸大：实际 R ≫ 透镜口径，比例示意非严格尺度）</text>
<circle cx="660" cy="265" r="104" fill="#fefce8" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="660" cy="265" r="34.0" fill="none" stroke="#1f2937" stroke-width="2"/>
<circle cx="660" cy="265" r="48.1" fill="none" stroke="#1f2937" stroke-width="2"/>
<circle cx="660" cy="265" r="58.9" fill="none" stroke="#1f2937" stroke-width="2"/>
<circle cx="660" cy="265" r="68.0" fill="none" stroke="#1f2937" stroke-width="2"/>
<circle cx="660" cy="265" r="76.0" fill="none" stroke="#1f2937" stroke-width="2"/>
<circle cx="660" cy="265" r="83.3" fill="none" stroke="#1f2937" stroke-width="2"/>
<circle cx="660" cy="265" r="90.0" fill="none" stroke="#1f2937" stroke-width="2"/>
<circle cx="660" cy="265" r="96.2" fill="none" stroke="#1f2937" stroke-width="2"/>
<circle cx="660" cy="265" r="5.5" fill="#1f2937"/>
<line x1="660" y1="265" x2="691.5" y2="252.3" stroke="#b45309" stroke-width="1.5" marker-start="url(#mBrown)" marker-end="url(#mBrown)"/>
<text x="698" y="247" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" >r₁</text>
<line x1="660" y1="265" x2="724.7" y2="286.0" stroke="#b45309" stroke-width="1.5" marker-start="url(#mBrown)" marker-end="url(#mBrown)"/>
<text x="731" y="293" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" >r₄ = 2r₁</text>
<text x="596" y="170" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" >第 m 级暗环</text>
<line x1="596" y1="177" x2="596" y2="206" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="710" y="206" font-size="12.5" fill="#334155" text-anchor="start" font-weight="normal" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" >中心暗斑</text>
<line x1="706" y1="210" x2="667" y2="258" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="660" y="398" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold" >暗环半径：r = √(mλR)（m = 1, 2, 3, …）</text>
<text x="660" y="418" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal" >相邻环距随级次增大而变窄 → 内疏外密</text>
<text x="660" y="438" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" >中心为暗斑：反射光中观察，空气层上下表面反射存在半波损失</text>
</svg>

name: Deploy to server
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: admin
          key: ${{ secrets.SSH_KEY }}
          source: "./*"
          target: /var/www/course
          rm: true
